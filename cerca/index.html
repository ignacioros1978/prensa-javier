<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b08">
<title>Cerca de ti</title>
<meta http-equiv="Cache-Control" content="no-cache">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Una sola pantalla de móvil: cabecera, interruptor, favoritos, 4 filas de 4 iconos y buscador. La lista sustituye a la cuadrícula. */
:root{
  --bg:#0d0b08; --card:#17140f; --card-2:#2a2316; --line:#2e281e; --line-2:#3a3226;
  --ink:#f5ecd9; --muted:#cfc3a8; --gold:#e6c27a; --gold-ink:#17120a; --ok:#7fe0a0; --bad:#ff9a8c; --bad-bg:#2a1715;
  --f:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.app>*{min-width:0} #vHome,#vList{width:100%} .list,.it{min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding:calc(12px + env(safe-area-inset-top,0px)) max(14px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
a{color:var(--gold)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px;min-height:calc(100dvh - 26px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;gap:10px}
.round{flex:none;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line-2);background:var(--card);display:grid;place-items:center;text-decoration:none;color:var(--gold);cursor:pointer}
.round svg{width:20px;height:20px}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:26px;line-height:1.05;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
.where{display:flex;align-items:center;gap:5px;margin-top:3px;font-size:14px;font-weight:600;color:var(--muted);min-width:0}
.where span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.wait{background:var(--gold);animation:pulse 1.2s infinite} .dot.bad{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:46px;padding:0 12px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);font-size:15px;font-weight:700;cursor:pointer;text-align:left;width:100%}
.trk{position:relative;flex:none;width:50px;height:28px;border-radius:99px;background:var(--line-2);transition:background .2s}
.trk i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.switch[aria-pressed="true"] .trk{background:var(--gold)} .switch[aria-pressed="true"] .trk i{left:25px;background:var(--gold-ink)}
.favs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;min-height:44px}
.favs::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;background:var(--card-2);border:1.5px solid #5a4a2c;color:var(--ink);text-decoration:none;font-weight:700;font-size:14px;max-width:220px}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip svg{flex:none;width:16px;height:16px}
.favs .hint{display:flex;align-items:center;font-size:14px;font-weight:600;color:var(--muted)}
.grp{display:flex;flex-direction:column;gap:7px}
.grp h2{margin:0;font-size:14px;font-weight:800;color:var(--gold);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:80px;padding:6px 3px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);color:var(--ink);text-align:center;cursor:pointer}
.tile svg{width:27px;height:27px;stroke:var(--gold);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tile b{font-size:14px;line-height:1.12;font-weight:800;hyphens:manual}
.tile.gold{background:var(--card-2);border-color:#7a6235}
.tile.red{background:var(--bad-bg);border-color:#7a352d} .tile.red svg{stroke:var(--bad)}
.tile:active{transform:scale(.97)}
.search{display:flex;gap:8px;margin-top:auto}
.search input{flex:1;min-width:0;height:48px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--card);font-size:16px}
.btn-gold{flex:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 16px;border-radius:14px;border:0;background:var(--gold);color:var(--gold-ink);text-decoration:none;font-weight:800;font-size:16px;cursor:pointer}
.btn-gold svg{width:20px;height:20px}
.btn-line{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:14px;border:1.5px solid var(--line-2);background:transparent;color:var(--ink);text-decoration:none;font-weight:700;font-size:15px;cursor:pointer;width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* Lista */
.list{display:flex;flex-direction:column;gap:8px}
.it{display:flex;flex-direction:column;gap:6px;padding:10px 10px 10px 12px;border-radius:16px;background:var(--card);border:1.5px solid var(--line)}
.it .r1{display:flex;align-items:baseline;gap:10px}
.it .nm{flex:1;min-width:0;font-size:16px;font-weight:800;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .ds{flex:none;font-size:16px;font-weight:800;color:var(--gold);white-space:nowrap;font-variant-numeric:tabular-nums}
.it .r2{display:flex;align-items:center;gap:8px}
.it .inf{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--muted)}
.it .inf div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .inf .h{font-weight:700}
.it .inf .sg{white-space:normal;font-weight:800;color:#e6c27a}.it .inf .sg.ok{color:#7fe0a0}
.mine{font-weight:800;color:#7fe0a0}.rm{min-height:44px;padding:0 10px;border:0;background:none;color:#e6c27a;font-weight:800;font-size:14px;text-decoration:underline;cursor:pointer}
.sgh{margin:6px 2px 0;font-size:15px;font-weight:800;color:var(--ink)}
.sgmap{position:relative;flex:none;height:30vh;min-height:170px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line-2);background:#1d1a14}
.sgmap iframe{width:100%;height:100%;border:0;display:block}
.sq{flex:none;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;text-decoration:none;color:var(--gold);cursor:pointer}
.sq svg{width:20px;height:20px}
.sq[aria-pressed="true"] svg{fill:var(--gold)}
.go{flex:1;justify-content:center;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border-radius:12px;background:var(--gold);color:var(--gold-ink);text-decoration:none;font-weight:800;font-size:14px}
.go svg{width:18px;height:18px}
.msg{padding:16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);font-size:15px;font-weight:600;line-height:1.45;color:var(--muted)}
.msg b{color:var(--ink)}
.msg .btn-gold,.msg .btn-line{margin-top:10px}
.skel{height:86px;border-radius:16px;background:linear-gradient(90deg,var(--card) 0%,#201b14 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.note{font-size:14px;font-weight:600;color:var(--muted);line-height:1.4}
.manual{display:flex;gap:8px;margin-top:10px}
.manual input{flex:1;min-width:0;height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--bg);font-size:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Pantalla principal fija: ocupa exactamente la pantalla y los iconos se reparten el alto que quede */
html,body{height:100%}
body{height:100dvh;min-height:0;overflow:hidden;overscroll-behavior:none}
body.scroll{height:auto;min-height:100dvh;overflow:auto}
#app{height:100%;min-height:0}
body.scroll #app{height:auto}
#vHome{flex:1;min-height:0!important;height:100%}
#vHome>.top,#vHome>.switch,#vHome>.favs,#vHome>.search{flex:none}
#groups{flex:1;min-height:0;gap:8px!important}
.grp{flex:1;min-height:0;gap:5px}
.grp h2{flex:none}
.grid{flex:1;min-height:0;grid-template-rows:minmax(0,1fr)}
.tile{height:auto;min-height:0;max-height:96px;overflow:hidden}
.tile svg{flex:none}
.search{margin-top:0}
.favs .hint{font-size:14px;line-height:1.2}
@media (max-height:600px){.grp h2{display:none}}
@media (max-height:640px){.tile svg{width:22px;height:22px}.tile{gap:2px;padding:4px 3px}h1{font-size:23px}.switch{min-height:44px}}

/* Lista con mapa: el mapa arriba (Google Maps dentro de la app) y la lista desplazable debajo */
#vList{height:100%;min-height:0!important}
#vList>.top,.maprow{flex:none}
#vMap{height:100%;min-height:0!important}
#vMap>.top{flex:none}
#vMap .mapbox{flex:1;height:auto}
#vList>#allMap{flex:none}
.mapbox{position:relative;flex:none;height:36vh;min-height:180px;border-radius:16px;overflow:hidden;border:1.5px solid var(--line-2);background:#1d1a14}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mapcap{position:absolute;left:8px;bottom:8px;max-width:calc(100% - 16px);padding:6px 10px;border-radius:10px;background:rgba(13,11,8,.88);color:var(--ink);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.mapcap:empty{display:none}
#vList.big .mapbox{flex:1;height:auto}
#vList.big .listwrap{display:none}
.maprow{display:flex;gap:8px}
.maprow .btn-gold{flex:1;min-height:48px}
#bigMap[aria-pressed="true"]{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.listwrap{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.pinb{flex:none;display:inline-flex;align-items:center;gap:5px;height:44px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line-2);background:transparent;color:var(--ink);font-weight:800;font-size:14px;cursor:pointer}
.pinb svg{width:18px;height:18px}
.it.sel{border-color:var(--gold);background:var(--card-2)}
.diag{font-size:13px;color:#9d927a;margin-top:6px}
</style>
</head>
<body>
<div class="app" id="app">

<!-- ============ PANTALLA PRINCIPAL ============ -->
<section id="vHome" class="app" style="min-height:0;gap:10px;flex:1">
  <div class="top">
    <a class="round" id="backPortal" href="https://claude.ai/artifact/W8amFgBBMMe2gPNubcCSNb" aria-label="Volver al Portal de Casa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a>
    <div class="ttl">
      <h1>Cerca de ti <span style="font-size:12px;font-weight:700;color:#9d927a;letter-spacing:0;vertical-align:middle">v14</span></h1>
      <div class="where"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e6c27a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg><span class="t" id="whereTxt">Buscando tu ubicación…</span><span class="dot wait" id="whereDot" aria-hidden="true"></span></div>
    </div>
    <button class="round" id="relocate" type="button" aria-label="Volver a localizarme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7.5"/></svg></button>
  </div>

  <button class="switch" id="openNow" type="button" aria-pressed="false"><span>Solo abiertos ahora</span><span class="trk" aria-hidden="true"><i></i></span></button>

  <div class="favs" id="favs" aria-label="Tus sitios"></div>

  <div id="groups" style="display:flex;flex-direction:column;gap:10px"></div>

  <form class="search" id="freeForm">
    <label for="q" class="sr">Buscar otra cosa cerca</label>
    <input id="q" type="search" placeholder="Buscar otra cosa cerca…" autocomplete="off" enterkeyhint="search">
    <button class="btn-gold" type="submit">Buscar</button>
  </form>
</section>

<!-- ============ LISTA ============ -->
<section id="vList" class="app" style="min-height:0;gap:10px;flex:1" hidden>
  <div class="top">
    <button class="round" id="backHome" type="button" aria-label="Volver a Cerca de ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="ttl">
      <h1 id="lTitle" style="font-size:24px">—</h1>
      <div class="where"><span class="dot ok" id="lDot" aria-hidden="true"></span><span class="t" id="lSub">de más cerca a más lejos</span></div>
    </div>
  </div>
  <button class="btn-gold" id="allMap" type="button" style="min-height:52px;font-size:17px;flex:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5zM9 4v13.5M15 6.5V20"/></svg>Verlos todos en el mapa</button>
  <div class="listwrap" id="listWrap">
    <div class="list" id="list" aria-live="polite"></div>
    <button class="btn-line" id="more" type="button" hidden style="margin-top:8px">Ver más sitios</button>
    <button class="btn-line" id="addOpen" type="button" style="margin-top:8px">＋ ¿Falta un sitio? Añádelo</button>
    <form id="addForm" class="msg" hidden style="margin-top:8px;display:flex;flex-direction:column;gap:8px">
      <b style="color:var(--ink)">Añadir un sitio que falta</b>
      <label for="addName" style="font-weight:700">Nombre</label>
      <input id="addName" required placeholder="Por ejemplo: Aldi" autocomplete="off" style="height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:16px">
      <label for="addAddr" style="font-weight:700">Dirección (si no estás en la puerta)</label>
      <input id="addAddr" placeholder="Calle y número, ciudad" autocomplete="off" style="height:48px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line-2);background:var(--bg);color:var(--ink);font-size:16px">
      <button class="btn-gold" type="submit" data-how="addr">Guardar con esa dirección</button>
      <button class="btn-gold" type="submit" data-how="here">Estoy en la puerta: usar mi ubicación</button>
      <span id="addMsg" style="font-weight:700"></span>
    </form>
    <p class="note" id="lNote"></p>
    <p class="diag" id="diag"></p>
  </div>
</section>

<!-- ============ MAPA ============ -->
<section id="vMap" class="app" style="min-height:0;gap:10px;flex:1" hidden>
  <div class="top">
    <button class="round" id="backList" type="button" aria-label="Volver a la lista"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
    <div class="ttl">
      <h1 id="mTitle" style="font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">—</h1>
      <div class="where"><span class="t" id="mSub"></span></div>
    </div>
  </div>
  <div class="mapbox" id="mapBox"><iframe id="map" title="Mapa" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
  <div class="maprow" id="mapRow">
    <a class="go" id="mGo" href="#" target="_blank" rel="noopener" style="min-height:48px;font-size:16px"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>Cómo llegar</a>
    <button class="btn-line" id="mAll" type="button" style="flex:1;min-height:48px;width:auto">Verlos todos</button>
  </div>
</section>

</div>

<script>
(function(){
'use strict';
/* ---------- categorías ----------
   osm: filtros de OpenStreetMap para la lista; g: lo que se busca en Google Maps («Verlos todos»).
   google:true = no hay datos fiables en OpenStreetMap: se abre Google Maps directamente. */
const I={
 rest:'<path d="M7 3v18M5 3v5a2 2 0 0 0 4 0V3M17 21V3c-2 1.5-3 4-3 7h3"/>',
 rapida:'<path d="M4 11a8 6 0 0 1 16 0zM3.5 14.5h17M5 17.5h14a2.5 2.5 0 0 1-2.5 2.5h-9A2.5 2.5 0 0 1 5 17.5z"/>',
 gluten:'<path d="M12 21V8M12 8C10 7 9 5 9 3c2 1 3 3 3 5zm0 0c2-1 3-3 3-5-2 1-3 3-3 5zM12 13.5c-2-1-3-3-3-5M12 13.5c2-1 3-3 3-5M4 4l16 16"/>',
 cafe:'<path d="M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2M8 3v3M12 3v3"/>',
 super:'<path d="M3 4h2l2.5 11h10L20 7H6.4"/><circle cx="9.5" cy="19.5" r="1.3"/><circle cx="16.5" cy="19.5" r="1.3"/>',
 farm:'<path d="M9 4h6v5h5v6h-5v5H9v-5H4V9h5z"/>',
 guardia:'<path d="M8 7h4v4h4v4h-4v4H8v-4H4v-4h4zM19 3.5a3.2 3.2 0 1 0 2 5.6 4 4 0 0 1-2-5.6z"/>',
 cajero:'<path d="M3 6h18v12H3zM3 10h18M7 15h3"/>',
 taxi:'<path d="M9 3.5h6V6H9zM5 16v-5l2-5h10l2 5v5M4 16h16v3h-3v-2H7v2H4zM7.5 13.5h.01M16.5 13.5h.01"/>',
 gas:'<path d="M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3.5 21h13M7 9h6M15 8l3 3v7a1.5 1.5 0 0 0 3 0v-8l-3-3"/>',
 parking:'<path d="M4 4h16v16H4zM9.5 17V7h3.5a3 3 0 0 1 0 6H9.5"/>',
 pmr:'<circle cx="11" cy="4.5" r="1.5"/><path d="M11 8v6h5l2 5M11 11h4.5M8 11.5a5.2 5.2 0 1 0 6.5 7"/>',
 parque:'<path d="M4 21 8 3h8l4 18M8 3h8M10 3v10M14 3v10M9 13h6"/>',
 helado:'<path d="M7.5 10a4.5 4.5 0 0 1 9 0zM7.5 10 12 21l4.5-11"/>',
 urg:'<path d="M4 21V7l8-4 8 4v14M10 21v-4h4v4M12 8v6M9 11h6"/>',
 banos:'<circle cx="7" cy="4.5" r="1.5"/><circle cx="17" cy="4.5" r="1.5"/><path d="M5 8h4v7H8v6H6v-6H5zM15 8h4l1 7h-2v6h-2v-6h-2zM12 3v18"/>'
};
/* Cadenas de supermercado: así salen aunque en el mapa estén marcadas como «tienda» o «autoservicio» */
const SUPER_RX='"(^|[^a-z])(aldi|dia|lidl|mercadona|carrefour|supersol|alcampo|eroski|hipercor|covir[aá]n|spar|bm|masymas|el jam[oó]n|maskom|cash fresh|ahorramas|consum|simply|froiz|gadis|caprabo|bonpreu|condis|family cash|supercor|opencor)([^a-z]|$)"';
/* Cadenas con opciones sin gluten conocidas en España (siempre conviene confirmarlo en el local) */
const SG_CHAINS='McDonald|Burger King|Telepizza|Domino|Goiko|100 Montaditos|Foster|VIPS|Ginos|Tagliatella';
const SG_SUPER='Mercadona|Carrefour|Lidl|Aldi|Dia|Alcampo|Hipercor|Supercor|El Corte Ingl|Eroski';
const GROUPS=[

function locate(){
  if(!('geolocation' in navigator)){setWhere('Este navegador no da la ubicación','bad');return;}
  setWhere('Buscando tu ubicación…','wait'); S.t0=performance.now(); S.diag.loc=0;
  let got=false;
  const wd=setTimeout(()=>{if(got)return;S.pos=null;setWhere('No se pudo localizar','bad');if(S.cat)loadList(S.cat);},20000);
  const ok=p=>{got=true;clearTimeout(wd);setPos(p);};
  const ko=err=>{if(got)return;if(err.code===1){clearTimeout(wd);got=true;S.pos=null;setWhere('Sin permiso de ubicación','bad');if(S.cat)loadList(S.cat);}};
  /* Primero una ubicación rápida (wifi o antenas, al momento) y después la del GPS, más precisa */
  navigator.geolocation.getCurrentPosition(ok,ko,{enableHighAccuracy:false,timeout:6000,maximumAge:300000});
  navigator.geolocation.getCurrentPosition(ok,ko,{enableHighAccuracy:true,timeout:20000,maximumAge:30000});
}
async function reverse(pos){

    const street=a.road||a.pedestrian||a.square||a.neighbourhood||a.suburb||'';
    const town=a.city||a.town||a.village||a.municipality||'';

/* ---------- datos (OpenStreetMap) ---------- */
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.private.coffee/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter'];
function fetchTO(url,ms){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t));}
async function tryOne(u,q,ms){const r=await fetchTO(u+'?data='+encodeURIComponent(q),ms);if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j||!Array.isArray(j.elements))throw new Error('respuesta rara');return j;}
async function overpass(q){
  /* Pregunta a todos los servidores a la vez y se queda con el primero que conteste bien */
  const errs=[];
  try{return await Promise.any(OVERPASS.map(u=>tryOne(u,q,9000).catch(e=>{errs.push(e&&e.name==='AbortError'?'tiempo agotado':String(e&&e.message||e));throw e;})));}
  catch(e){throw new Error('Mapa libre: '+(errs.join(', ')||'sin respuesta'));}
}
const NM={rest:'restaurant',rapida:'fast_food',cafe:'cafe',super:'supermarket',farm:'pharmacy',cajero:'atm',taxi:'taxi',gas:'fuel',parking:'parking',parque:'playground',helado:'ice_cream',urg:'hospital',banos:'toilets'};
async function nomin(c,pos){
  const t=NM[c.id]; if(!t) throw new Error('sin respaldo');
  const max=(c.r||[2000,5000]).slice(-1)[0], dLa=max/111000, dLo=max/(111000*Math.cos(pos.lat*Math.PI/180));
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&accept-language=es&limit=40&bounded=1&amenity='+t+'&viewbox='+(pos.lon-dLo)+','+(pos.lat+dLa)+','+(pos.lon+dLo)+','+(pos.lat-dLa);
  const r=await fetchTO(u,9000); if(!r.ok) throw new Error('Nominatim HTTP '+r.status);
  const j=await r.json();
  const items=(j||[]).map(x=>{const lat=+x.lat,lon=+x.lon;const nm=x.name||String(x.display_name||'').split(',')[0]||c.t;
    return {id:(x.osm_type||'x')+'/'+(x.osm_id||lat+','+lon),name:nm,addr:String(x.display_name||'').split(',').slice(1,3).join(',').trim(),hours:'',lat,lon,d:dist(pos,{lat,lon})};})
    .filter(x=>x.d<=max).sort((a,b)=>a.d-b.d);
  return {items,radius:max,src:'Nominatim'};
}
function addr(t){
  const s=[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(', ');
  return s||t['addr:place']||t['addr:city']||'';
}
function sgNote(t,name){
  const txt=(t.brand||'')+' '+name+' '+(t.description||'')+' '+(t.cuisine||'');
  const shop=t.shop||'';
  if(/^(yes|only|limited)$/.test(t['diet:gluten_free']||'')||/sin gluten|gluten.?free|cel[ií]ac|sin tacc/i.test(txt)||new RegExp(SG_CHAINS,'i').test(txt)) return {k:'ok',t:shop?'Productos sin gluten':'Opciones sin gluten'};
  if(shop==='health_food'||(!shop||/^(supermarket|convenience|department_store|grocery|discount)$/.test(shop))&&new RegExp('(^|[^a-z])('+SG_SUPER+')([^a-z]|$)','i').test(txt)) return {k:'ok',t:'Productos sin gluten'};
  return '';
}
const rank=x=>x.note&&x.note.k==='ok'?0:x.note&&x.note.k==='mid'?1:2;
function sortItems(a){return a.sort((p,q)=>p.d-q.d);}
function mergeItems(a,b){
  const out=a.slice();
  for(const x of b){ if(!out.some(y=>dist(x,y)<15||(dist(x,y)<80&&x.name.toLowerCase()===y.name.toLowerCase()))) out.push(x); }
  return sortItems(out);
}
async function photon1(q,tag,pos){
  const u='https://photon.komoot.io/api/?limit=50&lat='+pos.lat+'&lon='+pos.lon+'&q='+encodeURIComponent(q)+(tag?'&osm_tag='+encodeURIComponent(tag):'');
  const r=await fetchTO(u,8000); if(!r.ok) throw new Error('Photon HTTP '+r.status);
  const j=await r.json(); return j.features||[];
}
const PH_GLUTEN=[['sin gluten',null],['McDonald\'s','amenity'],['Burger King','amenity'],['Telepizza','amenity'],['Domino\'s','amenity'],['Goiko','amenity'],['100 Montaditos','amenity'],['Foster\'s Hollywood','amenity'],['VIPS','amenity'],['Ginos','amenity'],['Mercadona','shop'],['Aldi','shop'],['Dia','shop'],['Lidl','shop'],['Carrefour','shop'],['herbolario','shop']];
const PH_SUPER=['supermercado','aldi','dia','mercadona','lidl','carrefour','supersol','coviran','spar','el jamon'];
async function photon(c,pos){
  const ph=PH[c.id]; if(!ph) throw new Error('sin respaldo');
  let feats;
  if(c.id==='super'){
    const all=await Promise.allSettled(PH_SUPER.map(q=>photon1(q,q==='supermercado'?ph[1]:'shop',pos)));
    feats=all.flatMap(x=>x.status==='fulfilled'?x.value:[]);
    if(!feats.length&&all.every(x=>x.status==='rejected')) throw all[0].reason;
  } else if(c.id==='gluten'){
    const all=await Promise.allSettled(PH_GLUTEN.map(([q,t])=>photon1(q,t,pos)));
    feats=all.flatMap(x=>x.status==='fulfilled'?x.value:[]);
    if(!feats.length&&all.every(x=>x.status==='rejected')) throw all[0].reason;
  } else feats=await photon1(ph[0],ph[1],pos);
  const max=(c.r||[1500,5000]).slice(-1)[0], seen=new Set();
  const items=feats.map(f=>{const g=f.geometry&&f.geometry.coordinates;if(!g)return null;const pr=f.properties||{};const lat=g[1],lon=g[0];
    if(c.id==='super'&&!/^(supermarket|convenience|grocery|discount|department_store|wholesale)$/.test(pr.osm_value||''))return null;
    const name=pr.name||c.t, note=c.id==='gluten'?sgNote(pr.osm_key==='shop'?{shop:pr.osm_value}:{},name):'';
    if(c.id==='gluten'&&!note) return null;
    return {id:(pr.osm_type||'x')+'/'+(pr.osm_id||lat+','+lon),name,addr:[pr.street,pr.housenumber].filter(Boolean).join(', '),hours:'',lat,lon,d:dist(pos,{lat,lon}),note,t:{shop:pr.osm_key==='shop'?pr.osm_value:''}};})
    .filter(x=>x&&x.d<=max&&!seen.has(x.id)&&seen.add(x.id)).sort((a,b)=>a.d-b.d);
  return {items,radius:max,src:'Photon'};
}
/* Sin gluten: reutiliza las búsquedas que ya funcionan (súper, comida rápida, restaurantes, cafeterías)
   y se queda con los sitios que tienen opciones o productos sin gluten, más los marcados expresamente */
async function fetchGluten(c,pos,onUpdate){
  const subs=[['super',CAT.super],['rapida',CAT.rapida],['rest',CAT.rest],['cafe',CAT.cafe],['gluten',Object.assign({},c,{_raw:true})]];
  const parts={};
  const build=()=>{let items=[];
    for(const [id,r] of Object.entries(parts)){
      items=items.concat(r.items.map(x=>{const t=Object.assign({},x.t||{});if(id==='super'&&!t.shop)t.shop='supermarket';const note=x.note&&x.note.t?x.note:sgNote(t,x.name);return note?Object.assign({},x,{note}):null;}).filter(Boolean));
    }
    return {items:mergeItems([],items),radius:5000,src:'OpenStreetMap'};};
  return new Promise(resolve=>{
    let pending=subs.length,done=false;
    subs.forEach(([id,cc])=>fetchCat(cc,pos,r=>{parts[id]=r;if(done&&onUpdate)onUpdate(build());})
      .then(r=>{parts[id]=r;const b=build();if(!done&&b.items.length){done=true;resolve(b);}else if(done&&onUpdate)onUpdate(b);})
      .catch(()=>{})
      .finally(()=>{pending--;if(!pending&&!done){done=true;resolve(build());}}));
  });
}
async function fetchCat(c,pos,onUpdate){
  if(c.id==='gluten'&&!c._raw) return fetchGluten(c,pos,onUpdate);
  /* Tres fuentes a la vez: enseña la primera que traiga sitios y va sumando las demás cuando llegan */
  S.diag.src={};
  const timed=(name,pr)=>{const t=performance.now();S.diag.src[name]='…';return pr.then(r=>{S.diag.src[name]=((performance.now()-t)/1000).toFixed(1).replace('.',',')+' s ('+r.items.length+')';showDiag();return r;},e=>{S.diag.src[name]='falla: '+String(e&&e.message||e).slice(0,40);showDiag();throw e;});};
  const jobs=[timed('Mapa libre',fetchCatOv(c,pos))];
  if(PH[c.id]) jobs.push(timed('Photon',photon(c,pos)));
  if(NM[c.id]) jobs.push(timed('Nominatim',nomin(c,pos)));
  return new Promise((resolve,reject)=>{
    let best=null,pending=jobs.length,done=false;const errs=[];
    jobs.forEach(j=>j.then(res=>{
      best=best?{items:mergeItems(best.items,res.items),radius:Math.max(best.radius,res.radius),src:best.src+' + '+res.src}:res;
      if(!done&&best.items.length){done=true;resolve(best);}else if(done&&onUpdate)onUpdate(best);
    }).catch(e=>errs.push(String(e&&e.message||e))).finally(()=>{pending--;if(!pending&&!done){done=true;best?resolve(best):reject(new Error(errs.join(' · ')||'sin respuesta'));}}));
  });
}
async function fetchCatOv(c,pos){
  const radii=c.r||[2000,5000];
  for(const r of radii){
    const q='[out:json][timeout:10];('+c.osm.map(f=>'nwr'+f+'(around:'+r+','+pos.lat+','+pos.lon+');').join('')+');out center tags 400;';
    const j=await overpass(q);
    const seen=new Set();
    const items=(j.elements||[]).map(e=>{
      const lat=e.lat??e.center?.lat, lon=e.lon??e.center?.lon; if(lat==null) return null;
      const t=e.tags||{};
      const name=t.name||t.brand||t.operator||(c.id==='banos'?'Aseo público':c.id==='cajero'?'Cajero':c.id==='parque'?'Parque infantil':c.id==='taxi'?'Parada de taxi':c.id==='pmr'?'Plaza para personas con movilidad reducida':c.id==='parking'?'Aparcamiento':'Sin nombre');
      return {id:e.type+'/'+e.id,name,addr:addr(t),hours:t.opening_hours||'',lat,lon,d:dist(pos,{lat,lon}),note:c.id==='gluten'?sgNote(t,name):'',t:{brand:t.brand||'',shop:t.shop||'','diet:gluten_free':t['diet:gluten_free']||'',cuisine:t.cuisine||'',description:t.description||''}};
    }).filter(Boolean).filter(x=>{const k=x.name+'|'+Math.round(x.lat*2000)+'|'+Math.round(x.lon*2000);if(seen.has(k))return false;seen.add(k);return true;});
    sortItems(items);
    if(items.length>=3||r===radii[radii.length-1]) return {items,radius:r,src:'OpenStreetMap'};
  }
}

  $('#mTitle').textContent='Todos: '+c.t.toLowerCase();
  $('#mSub').textContent=p?'Alrededor de '+(p.label||'ti'):'';
  $('#mGo').hidden=true; $('#mAll').hidden=true;
  openMap();
}
function mapOne(k){
  const x=S.items[k]; if(!x) return;
  setMap(embed(x.lat+','+x.lon,x.lat,x.lon,17));
  $('#mTitle').textContent=x.name;
  $('#mSub').textContent=fmtD(x.d)+' · '+fmtT(x.d,!!CAT[S.cat].drive)+(x.addr?' · '+x.addr:'');
  $('#mGo').href=gRoute(x,!!CAT[S.cat].drive); $('#mGo').hidden=false;
  $('#mAll').hidden=false; $('#mAll').textContent='Ver todos';
  openMap();
}
function showDiag(){const d=$('#diag');if(!d)return;const s=S.diag.src||{};d.textContent='Ubicación: '+(S.diag.loc?S.diag.loc.toFixed(1).replace('.',',')+' s':'—')+(S.pos&&S.pos.acc?' (±'+Math.round(S.pos.acc)+' m)':'')+' · '+Object.entries(s).map(([k,v])=>k+': '+v).join(' · ');}
function setNote(c,res){$('#lNote').textContent=(c.id==='gluten'?'Restaurantes, cafeterías, cadenas y tiendas con opciones o productos sin gluten. Para celíacos, confirma siempre en el local. ':'')+(S.open?'El filtro «solo abiertos» se aplica en «Verlos todos en el mapa»; aquí verás el horario cuando se conozca. ':'')+S.items.length+' sitios · Datos: '+(res.src||'OpenStreetMap')+'.';}
async function loadList(id){
  const c=CAT[id];
  $('#more').hidden=true; $('#lNote').textContent='';
  if(!S.pos&&$('#whereDot').classList.contains('wait')){
    $('#lSub').textContent='Buscando tu ubicación…';$('#lDot').className='dot wait';
    $('#list').innerHTML='<div class="msg"><b>Buscando dónde estás…</b> En cuanto lo sepa, aparece la lista.</div><div class="skel"></div><div class="skel"></div>';
    return;
  }
  if(!S.pos){
    $('#lSub').textContent='Necesito saber dónde estás';$('#lDot').className='dot bad';
    $('#list').innerHTML='<div class="msg"><b>No tengo tu ubicación.</b> Si el navegador te la ha pedido, acepta. Si dijiste que no, actívala en los ajustes del sitio (el candado junto a la dirección) y vuelve a intentarlo.<button class="btn-gold" type="button" data-act="relocate" style="width:100%">Volver a intentarlo</button>'+
      '<form class="manual" data-act="manual"><label for="mq" class="sr">Escribe dónde estás</label><input id="mq" placeholder="O escribe dónde estás (calle, ciudad)" autocomplete="off"><button class="btn-gold" type="submit">Usar</button></form></div>';
    return;
  }
  $('#lSub').textContent='Desde '+S.pos.label+' · de más cerca a más lejos';$('#lDot').className='dot ok';
  showDiag();
  $('#list').innerHTML='<div class="msg" id="loadMsg"><b>Buscando '+esc(c.t.toLowerCase())+' cerca de ti…</b></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  const slow=setTimeout(()=>{const m=$('#loadMsg');if(m)m.innerHTML='<b>Está tardando más de lo normal…</b> Los servidores del mapa van lentos. Si no quieres esperar, toca «Verlos todos en el mapa».';},4000);
  const key=id+'|'+S.pos.lat.toFixed(3)+'|'+S.pos.lon.toFixed(3);
  const saved=store.get('cerca.c14.'+key,null);
  if(!S.cache[key]&&saved&&Date.now()-saved.ts<30*60000){S.cache[key]=saved.res;}
  const keep=res=>{if(!res||!res.items||!res.items.length)return;store.set('cerca.c14.'+key,{ts:Date.now(),res});};
  const onUpdate=res=>{S.cache[key]=res;keep(res);if(S.cat!==id||S.view!=='list')return;const n=Math.max(S.shown,10);S.items=withExtras(res.items,id);S.shown=0;$('#list').innerHTML='';while(S.shown<Math.min(n,S.items.length))renderMore();setNote(c,res);};
  try{
    let res;try{res=S.cache[key]||(S.cache[key]=await fetchCat(c,S.pos,onUpdate));}finally{clearTimeout(slow);}
    keep(res); if(!res.items.length) S.cache[key]=null;
    if(S.cat!==id) return;
    S.items=withExtras(res.items,id); S.shown=0;
    if(!S.items.length){
      $('#list').innerHTML='<div class="msg"><b>No he encontrado '+esc(c.t.toLowerCase())+' a menos de '+fmtD(res.radius)+'.</b> '+(c.id==='gluten'?'':'Puede que no estén registrados en el mapa libre que uso. ')+'En el mapa de Google, que tiene muchos más datos, seguro que aparecen.<button class="btn-gold" type="button" data-act="gmap" style="width:100%">Verlos en el mapa de Google</button></div>';
      return;
    }
    $('#list').innerHTML=''; renderMore(); setNote(c,res);
    return;
    $('#lNote').textContent=(c.id==='gluten'?'Restaurantes, cafeterías, cadenas y tiendas con opciones o productos sin gluten. Para celíacos, confirma siempre en el local. ':'')+(S.open?'El filtro «solo abiertos» se aplica en «Verlos todos en el mapa»; aquí verás el horario cuando se conozca. ':'')+'Datos: '+(res.src||'OpenStreetMap')+'.';
  }catch(e){
    if(S.cat!==id) return;
    S.cache[key]=null;
    $('#list').innerHTML='<div class="msg"><b>No se pudo cargar la lista ahora mismo.</b> Comprueba la conexión y vuelve a intentarlo, o ábrelo en Google Maps.<div style="font-size:13px;margin-top:6px;opacity:.8">Detalle: '+esc(e&&e.message||e)+'</div><button class="btn-gold" type="button" data-act="retry" style="width:100%">Volver a intentarlo</button><a class="btn-line" href="'+esc(gSearch(c.g))+'" target="_blank" rel="noopener">Abrir en Google Maps</a></div>';
  }
}
function sgShop(n){return new RegExp(SG_SUPER,'i').test(n);}
function withExtras(items,id){
  const ex=store.get('cerca.extra',[]).filter(x=>x.cat===id||(id==='gluten'&&(x.cat==='super'&&sgShop(x.name)||x.cat==='gluten')));
  if(!ex.length||!S.pos) return items;
  const mine=ex.map(x=>({id:x.id,name:x.name,addr:x.addr||'',hours:'',lat:x.lat,lon:x.lon,d:dist(S.pos,x),mine:true,note:id==='gluten'?{k:'ok',t:x.cat==='super'?'Productos sin gluten':'Opciones sin gluten'}:''}));
  const rest=items.filter(y=>!mine.some(m=>dist(m,y)<40&&m.name.toLowerCase().slice(0,4)===y.name.toLowerCase().slice(0,4)));
  return mine.concat(rest).sort((p,q)=>p.d-q.d);
}
function isFav(x){return S.favs.some(f=>f.id===x.id);}
function renderMore(){
  const c=CAT[S.cat], drive=!!c.drive, next=S.items.slice(S.shown,S.shown+10);
  $('#list').insertAdjacentHTML('beforeend',next.map((x,i)=>{const k=S.shown+i;const prev=S.items[k-1];
    return '<div class="it" data-k="'+k+'"><div class="r1"><div class="nm">'+esc(x.name)+'</div><div class="ds">'+fmtD(x.d)+'</div></div>'+
    '<div class="inf">'+(x.mine?'<div class="mine">Añadido por ti <button type="button" class="rm" data-rm="'+esc(x.id)+'">Quitar</button></div>':'')+(x.note?'<div class="sg '+x.note.k+'">'+esc(x.note.t)+'</div>':'')+(x.addr?'<div>'+esc(x.addr)+'</div>':'')+'<div class="h">'+fmtT(x.d,drive)+(x.hours?' · <span style="font-weight:600">'+esc(x.hours)+'</span>':'')+'</div></div><div class="r2">'+
    '<button type="button" class="sq" data-fav="'+k+'" aria-pressed="'+isFav(x)+'" aria-label="Guardar en tus sitios">'+svg('<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" stroke="#e6c27a" stroke-width="1.8" stroke-linejoin="round"/>')+'</button>'+
    '<button type="button" class="pinb" data-pin="'+k+'" aria-label="Ver solo '+esc(x.name)+' en el mapa">'+svg('<path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z" fill="none" stroke="#e6c27a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="9" r="2.5" fill="none" stroke="#e6c27a" stroke-width="2"/>')+'Mapa</button>'+
    '<a class="go" href="'+esc(gRoute(x,drive))+'" target="_blank" rel="noopener">'+svg('<path d="M3 11 21 3l-8 18-2-8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>')+'Cómo llegar</a></div></div>';}).join(''));
  S.shown+=next.length;
  $('#more').hidden=S.shown>=S.items.length;
}
function toggleFav(k,btn){
  const x=S.items[k]; if(!x) return;
  if(isFav(x)) S.favs=S.favs.filter(f=>f.id!==x.id);
  else S.favs=[{id:x.id,name:x.name,lat:x.lat,lon:x.lon,drive:!!CAT[S.cat].drive},...S.favs].slice(0,12);
  store.set('cerca.favs',S.favs); btn.setAttribute('aria-pressed',String(isFav(x))); renderFavs();
}

/* ---------- eventos ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-cat]'); if(t){openCat(t.dataset.cat);return;}
  const f=e.target.closest('[data-fav]'); if(f){toggleFav(+f.dataset.fav,f);return;}
  const pn=e.target.closest('[data-pin]'); if(pn){mapOne(+pn.dataset.pin);return;}
  const rm=e.target.closest('[data-rm]'); if(rm){store.set('cerca.extra',store.get('cerca.extra',[]).filter(x=>x.id!==rm.dataset.rm));loadList(S.cat);return;}
  const a=e.target.closest('[data-act]');
  if(a&&a.dataset.act==='relocate'){locate();return;}
  if(a&&a.dataset.act==='retry'){loadList(S.cat);return;}
  if(a&&a.dataset.act==='gmap'){mapAll();return;}
});
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.id==='freeForm'){e.preventDefault();const q=$('#q').value.trim();window.open(gSearch(q||'sitios de interés'),'_blank','noopener');return;}
  if(f.id==='addForm'){e.preventDefault();
    const how=(e.submitter&&e.submitter.dataset.how)||'addr',name=$('#addName').value.trim(),ad=$('#addAddr').value.trim(),msg=$('#addMsg');
    if(!name){msg.textContent='Escribe el nombre.';return;}
    let p=null;
    try{
      if(how==='here'){if(!S.pos||S.pos.manual)throw new Error('Necesito tu ubicación');p={lat:S.pos.lat,lon:S.pos.lon,addr:ad};}
      else{if(!ad){msg.textContent='Escribe la dirección o toca «Estoy en la puerta».';return;}msg.textContent='Buscando la dirección…';const g=await geocode(ad);p={lat:g.lat,lon:g.lon,addr:ad};}
    }catch(err){msg.textContent=how==='here'?'No tengo tu ubicación ahora mismo.':'No encuentro esa dirección. Prueba con calle, número y ciudad.';return;}
    const ex=store.get('cerca.extra',[]);ex.push({id:'mio/'+Date.now(),cat:S.cat,name,addr:p.addr,lat:p.lat,lon:p.lon});store.set('cerca.extra',ex);
    f.reset();msg.textContent='';f.hidden=true;$('#addOpen').hidden=false;loadList(S.cat);return;}
  if(f.dataset.act==='manual'){e.preventDefault();const v=f.querySelector('input').value.trim();if(!v)return;
    try{S.pos=await geocode(v);S.cache={};setWhere('Desde '+v,'ok');loadList(S.cat);}catch(err){f.querySelector('input').value='';f.querySelector('input').placeholder='No encuentro ese sitio. Prueba con calle y ciudad';}}
});
$('#openNow').onclick=()=>{setOpen(!S.open);};
$('#relocate').onclick=locate;
$('#backHome').onclick=()=>history.back();
$('#more').onclick=renderMore;
$('#addOpen').onclick=()=>{$('#addOpen').hidden=true;$('#addForm').hidden=false;$('#addName').focus();};
$('#allMap').onclick=()=>{mapAll();};
$('#mAll').onclick=()=>{const c=CAT[S.cat],p=S.pos;setMap(embed(c.g,p?p.lat:null,p?p.lon:null,p?15:13));$('#mTitle').textContent='Todos: '+c.t.toLowerCase();$('#mSub').textContent=p?'Alrededor de '+(p.label||'ti'):'';$('#mGo').hidden=true;$('#mAll').hidden=true;};
$('#backList').onclick=()=>history.back();
window.addEventListener('popstate',()=>{if(S.view==='map'){show('list');return;}S.cat=null;show('home');});

renderGroups(); renderFavs(); setOpen(S.open); locate();
})();
</script>
</body>
